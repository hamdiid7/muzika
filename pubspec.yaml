name: muzika
description: Music Streaming app made in Flutter!
homepage: https://muzika.pages.dev

publish_to: 'none'
version: 1.0.6+196 # run update.sh after changing the version

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: ^3.47.6

dependencies:
  app_links: ^7.2.2
  audio_service: ^0.18.19
  audio_service_win: ^0.0.3
  audio_session: ^0.2.4
  cached_network_image: ^4.0.4
  crypto: ^3.0.8
  dynamic_color: ^2.1.0
  file_picker: ^13.1.0
  fluentui_system_icons: ^1.1.273
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  go_router: ^18.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  html: ^0.15.7
  http: ^1.6.0
  image: 4.5.4
  intl: ^0.20.2
  just_audio: ^0.10.6
  # Windows audio plays through mpv (media_kit), like the clips: the
  # Windows Media player plugin crashed on loading songs.
  just_audio_media_kit: ^2.1.0
  material_ui: ^1.6.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  mobile_scanner: ^7.4.2
  path_provider: ^2.1.6
  pointycastle: ^4.0.0
  posthog_flutter: ^5.58.3
  qr_flutter: ^4.1.0
  receive_sharing_intent:
    path: ./packages/receive_sharing_intent
  rxdart: ^0.28.0
  share_plus: ^13.3.1
  timezone: ^0.11.2
  tray_manager: ^0.5.0
  url_launcher: ^6.3.3
  window_manager: ^0.5.2
  youtube_explode_dart:
    path: ./packages/youtube_explode_dart
  youtube_music_explode_dart:
    path: ./packages/youtube_music_explode_dart
dev_dependencies:
  flutter_test:
    sdk: flutter

  # flutter_lints: ^2.0.0

# media_kit pulls in `image`; 4.11 needs a newer `archive` than the rest of
# the app resolves (ZLibDecoder.decodeLazy), so it is held at 4.5.
dependency_overrides:
  image: 4.5.4

flutter:
  generate: true
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/licenses/
    - assets/icons/tray.ico
    - assets/icons/muzika_logo.png
    # Nature pictures behind the lyric videos in Clips: add more here.
    - assets/lyric_backgrounds/

  fonts:
    - family: Metropolis
      fonts:
        - asset: assets/fonts/metropolis/Metropolis-Regular.otf
          weight: 400
        - asset: assets/fonts/metropolis/Metropolis-Medium.otf
          weight: 500
        - asset: assets/fonts/metropolis/Metropolis-SemiBold.otf
          weight: 600
        - asset: assets/fonts/metropolis/Metropolis-Bold.otf
          weight: 700
        - asset: assets/fonts/metropolis/Metropolis-ExtraBold.otf
          weight: 800
    - family: NotoSansEthiopic
      fonts:
        - asset: assets/fonts/muzika/NotoSansEthiopic.ttf
    - family: paytoneOne
      fonts:
        - asset: assets/fonts/paytone/PaytoneOne-Regular.ttf
